    updateSidebarButton();
  }
  function closeDrawer() {
    if (isMobileSidebar()) {
      els.drawer.classList.remove("open");
      els.scrim.classList.remove("open");
    } else {
      els.app.classList.add("sidebar-collapsed");
      storeSidebarCollapsed(true);
    }
    updateSidebarButton();
  }
  function toggleDrawer() {
    const open = isMobileSidebar() ? els.drawer.classList.contains("open") : !els.app.classList.contains("sidebar-collapsed");
    if (open) closeDrawer();
    else openDrawer();
  }

  function openSettings() {
    state.settingsOpen = true;
    state.calendarOpen = false;
    closeDayModal();
    if (isMobileSidebar()) closeDrawer();
    setSettingsStatus("");
    renderSettingsShell();
    renderSettingsNav();
    renderSettingsContent();
    if (!state.settings) void loadSettings();
    if (!state.models) void loadModels();
    if (!state.voices.length) void loadVoices();
  }

  function closeSettings() {
    state.settingsOpen = false;
    renderSettingsShell();
    renderApproval();
    scrollDown(true);
  }

  /* ---------- calendar ---------- */
  const HOUR_PX = 44;
  const calMonthFmt = new Intl.DateTimeFormat(undefined, { month: "long", year: "numeric" });
  const calDayFmt = new Intl.DateTimeFormat(undefined, { weekday: "long", month: "long", day: "numeric" });
  const calDowFmt = new Intl.DateTimeFormat(undefined, { weekday: "short" });
  const calTimeFmt = new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" });

  function setCalStatus(text) { els.calStatus.textContent = text || ""; }

  function dayBounds(ms) {
    const d = new Date(ms);
    const start = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    const end = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime();
    return { start, end };
  }

  // The month grid always shows 6 weeks starting on the Sunday on or before the 1st.
  function calGridRange() {
    const cursor = state.calCursor;
    const first = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
    const gridStart = new Date(first.getFullYear(), first.getMonth(), 1 - first.getDay());
    const gridEnd = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + 42);
    return { gridStart, gridEnd };
  }

  function eventsOverlapping(fromMs, toMs) {
    return state.calEvents
      .filter((e) => e.start < toMs && e.end > fromMs)
      .sort((a, b) => a.start - b.start);
  }

  function openCalendar() {
    state.calendarOpen = true;
    state.settingsOpen = false;
    if (isMobileSidebar()) closeDrawer();
    renderSettingsShell();
    renderCalendar();
    void loadCalendarEvents();
  }

  function closeCalendar() {
    state.calendarOpen = false;
    closeDayModal();
    renderSettingsShell();
    renderApproval();
    scrollDown(true);
  }

  function shiftCalMonth(delta) {
    state.calCursor = new Date(state.calCursor.getFullYear(), state.calCursor.getMonth() + delta, 1);
    renderCalendar();
    void loadCalendarEvents();
  }

  async function loadCalendarEvents() {
    const { gridStart, gridEnd } = calGridRange();
    state.calLoading = true;
    setCalStatus("Loading events...");
    try {
      const data = await getJson(`/api/calendar/events?from=${gridStart.getTime()}&to=${gridEnd.getTime()}`);
      state.calEvents = data.events || [];
      if (data.syncStatus) {
        els.calSub.textContent = data.syncStatus.startsWith("No external")
          ? "Sophie's internal calendar — the source of truth for your events."
          : `Sophie's internal calendar — the source of truth for your events. Mirrors to ${data.syncStatus}.`;
      }
      setCalStatus("");
    } catch (e) {
      setCalStatus(`Could not load events: ${e?.message || e}`);
    }
    state.calLoading = false;
    renderCalendar();
    if (state.calSelectedDay != null && !state.calEditing) renderDayModal();
  }

  function chipTime(ms) {
    const d = new Date(ms);
    return `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`;
  }

  function renderCalendar() {
    if (!state.calendarOpen) return;
    els.calLabel.textContent = calMonthFmt.format(state.calCursor);
    const { gridStart } = calGridRange();
    const month = state.calCursor.getMonth();
    const todayStart = dayBounds(Date.now()).start;
    const grid = els.calGrid;
    grid.innerHTML = "";
    for (let i = 0; i < 7; i++) {
      const dow = document.createElement("div");
      dow.className = "cal-dow";
      dow.textContent = calDowFmt.format(new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i));
      grid.appendChild(dow);
    }
    for (let i = 0; i < 42; i++) {
      const d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
      const { start: dayStart, end: dayEnd } = dayBounds(d.getTime());
      const evs = eventsOverlapping(dayStart, dayEnd);
      const cell = document.createElement("button");
      cell.type = "button";
      cell.className = "cal-day" + (d.getMonth() !== month ? " other" : "") +
        (dayStart === todayStart ? " today" : "") + (dayStart < todayStart ? " past" : "");
      const num = document.createElement("div");
      num.className = "cal-day-num";
      num.textContent = String(d.getDate());
      cell.appendChild(num);
      for (const e of evs.slice(0, 3)) {
        const chip = document.createElement("div");
        chip.className = "cal-chip";
        const h = document.createElement("span");
        h.className = "h";
        h.textContent = e.start < dayStart ? "↪" : chipTime(e.start);
        chip.appendChild(h);
        chip.appendChild(document.createTextNode(e.title));
        chip.title = e.title;
        cell.appendChild(chip);
      }
      if (evs.length > 3) {
        const more = document.createElement("div");
        more.className = "cal-more";
        more.textContent = `+${evs.length - 3} more`;
        cell.appendChild(more);
      }
      cell.addEventListener("click", () => openDayModal(dayStart));
      grid.appendChild(cell);
    }
  }

  /* ---------- day modal ---------- */
  function openDayModal(dayStartMs) {
    state.calSelectedDay = dayStartMs;
    state.calEditing = null;
    renderDayModal();
    els.dayModal.hidden = false;
  }

  function closeDayModal() {
    state.calSelectedDay = null;
    state.calEditing = null;
    els.dayModal.hidden = true;
  }

  function isPastDay(dayStartMs) {
    return dayStartMs < dayBounds(Date.now()).start;
  }

  function renderDayModal() {
    if (state.calSelectedDay == null) return;
    els.dayTitle.textContent = calDayFmt.format(new Date(state.calSelectedDay));
    els.dayAdd.hidden = Boolean(state.calEditing) || isPastDay(state.calSelectedDay);
    if (state.calEditing) renderEventForm();
    else renderDayTimeline();
  }

  // Assign overlapping events to side-by-side lanes within each overlap cluster.
  function layoutDayEvents(evs, dayStart, dayEnd) {
    const items = evs.map((e) => {
      const s = Math.max(e.start, dayStart);
      const en = Math.min(e.end, dayEnd);
      return {
        e,
        s,
        en,
        top: ((s - dayStart) / 3_600_000) * HOUR_PX,
        height: Math.max(24, ((en - s) / 3_600_000) * HOUR_PX - 2),
        lane: 0,
        lanes: 1,
      };
    });
    const out = [];
    let cluster = [];
    let laneEnds = [];
    const flush = () => {
      for (const item of cluster) item.lanes = laneEnds.length;
      out.push(...cluster);
      cluster = [];
      laneEnds = [];
    };
    for (const item of items) {
      if (cluster.length && laneEnds.every((end) => end <= item.s)) flush();
      let lane = laneEnds.findIndex((end) => end <= item.s);
      if (lane === -1) {
        lane = laneEnds.length;
        laneEnds.push(0);
      }
      laneEnds[lane] = item.en;
      item.lane = lane;
      cluster.push(item);
    }
    flush();
    return out;
  }

  function renderDayTimeline() {
    const { start: dayStart, end: dayEnd } = dayBounds(state.calSelectedDay);
    const past = isPastDay(dayStart);
    const isToday = dayStart === dayBounds(Date.now()).start;
    const body = els.dayBody;
    body.innerHTML = "";
    const evs = eventsOverlapping(dayStart, dayEnd);

    if (!evs.length) {
      const empty = document.createElement("div");
      empty.className = "day-empty";
      empty.textContent = past
        ? "Nothing was scheduled this day."
        : "Nothing scheduled. Tap a time slot or “+ Add event” to book something.";
      body.appendChild(empty);
    }

    const tl = document.createElement("div");
    tl.className = "day-timeline" + (past ? "" : " addable");
    if (!past) {
      // Tap an empty slot to start a new event at that hour (taps on an
      // existing event fall through to its own edit handler).
      tl.addEventListener("click", (e) => {
        if (e.target.closest(".day-event")) return;
        const hour = Math.max(0, Math.min(23, Math.floor((e.clientY - tl.getBoundingClientRect().top) / HOUR_PX)));
        state.calEditing = { id: "", start: dayStart + hour * 3_600_000 };
        renderDayModal();
      });
    }
    for (let h = 0; h < 24; h++) {
      const row = document.createElement("div");
      row.className = "hour-row";
      row.style.top = `${h * HOUR_PX}px`;
      const label = document.createElement("div");
      label.className = "hour-label";
      label.textContent = `${String(h).padStart(2, "0")}:00`;
      row.appendChild(label);
      tl.appendChild(row);
    }
    const layer = document.createElement("div");
    layer.className = "day-events";
    for (const item of layoutDayEvents(evs, dayStart, dayEnd)) {
      const el = document.createElement("div");
      el.className = "day-event";
      el.style.top = `${item.top}px`;
      el.style.height = `${item.height}px`;
      const width = 100 / item.lanes;
      el.style.left = `${item.lane * width}%`;
      el.style.width = `calc(${width}% - 3px)`;
      const title = document.createElement("div");
      title.className = "t";
      title.textContent = item.e.title;
      el.appendChild(title);
      if (item.height >= 40) {
        const meta = document.createElement("div");
        meta.className = "m";
        meta.textContent = `${calTimeFmt.format(new Date(item.e.start))} – ${calTimeFmt.format(new Date(item.e.end))}` +
          (item.e.location ? ` · ${item.e.location}` : "");
        el.appendChild(meta);
      }
      el.title = item.e.title;
      el.addEventListener("click", () => { state.calEditing = item.e; renderDayModal(); });
      layer.appendChild(el);
    }
    tl.appendChild(layer);
    if (isToday) {
      const line = document.createElement("div");
      line.className = "now-line";
      line.style.top = `${((Date.now() - dayStart) / 3_600_000) * HOUR_PX}px`;
      tl.appendChild(line);
    }
    body.appendChild(tl);
    // Open at the first event; on an empty day, the current time (today) or 08:00.
    const focusMs = evs.length
      ? Math.max(evs[0].start, dayStart)
      : (isToday ? Date.now() : dayStart + 8 * 3_600_000);
    requestAnimationFrame(() => {
      body.scrollTop = Math.max(0, ((focusMs - dayStart) / 3_600_000) * HOUR_PX - 20);
    });
  }

  /* ---------- event form ---------- */
  function toDateInput(ms) {
    const d = new Date(ms);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }
  function toTimeInput(ms) {
    const d = new Date(ms);
    return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  }

  function renderEventForm() {
    const editing = state.calEditing && state.calEditing.id ? state.calEditing : null;
    const dayStart = dayBounds(state.calSelectedDay).start;
    // New events start at the tapped slot, the next full hour (today), or 09:00.
    let defaultStart = dayStart + 9 * 3_600_000;
    if (!editing && Number.isFinite(state.calEditing?.start)) {
      defaultStart = state.calEditing.start;
    } else if (!editing && dayStart === dayBounds(Date.now()).start) {
      defaultStart = dayStart + Math.min(23, new Date().getHours() + 1) * 3_600_000;
    }
    const defaults = editing ?? {
      title: "",
      start: defaultStart,
      end: defaultStart + 3_600_000,
      location: "",
      notes: "",
      reminderLeads: [30, 5],
    };

    const body = els.dayBody;
    body.innerHTML = "";
    const form = document.createElement("form");
    form.className = "event-form";

    const field = (labelText, inputEl) => {
      const label = document.createElement("label");
      label.textContent = labelText;
      label.appendChild(inputEl);
      return label;
    };
    const textInput = (value, placeholder = "", type = "text") => {
      const input = document.createElement("input");
      input.type = type;
      input.className = "text-input";
      input.value = value;
      if (placeholder) input.placeholder = placeholder;
      return input;
    };

    const titleInput = textInput(defaults.title, "What is it?");
    const dateInput = textInput(toDateInput(defaults.start), "", "date");
    // No booking on days that have already passed; an event already sitting on
    // a past day may stay there (so its own date remains pickable).
    dateInput.min = toDateInput(editing ? Math.min(editing.start, Date.now()) : Date.now());
    const startInput = textInput(toTimeInput(defaults.start), "", "time");
    const endInput = textInput(toTimeInput(defaults.end), "", "time");
    const locationInput = textInput(defaults.location || "", "Place, address, or meeting link");
    const notesInput = document.createElement("textarea");
    notesInput.className = "text-input";
    notesInput.rows = 3;
    notesInput.value = defaults.notes || "";
    notesInput.placeholder = "Agenda, phone number, who asked...";
    const remindersInput = textInput((defaults.reminderLeads || []).join(", "), "e.g. 30, 5 (minutes before; empty = none)");

    form.appendChild(field("Title", titleInput));
    const times = document.createElement("div");
    times.className = "event-form-times";
    times.appendChild(field("Date", dateInput));
    times.appendChild(field("Start", startInput));
    times.appendChild(field("End", endInput));
    form.appendChild(times);
    form.appendChild(field("Location", locationInput));
    form.appendChild(field("Notes", notesInput));
    form.appendChild(field("Reminders (minutes before)", remindersInput));

    const error = document.createElement("div");
    error.className = "event-form-error";
    form.appendChild(error);

    const actions = document.createElement("div");
    actions.className = "event-form-actions";
    if (editing) {
      const del = document.createElement("button");
      del.type = "button";
      del.className = "btn-danger-ghost grow";
      del.textContent = "Cancel event";
      del.addEventListener("click", async () => {
        if (!confirm(`Cancel "${editing.title}"? Its reminders will be removed.`)) return;
        del.disabled = true;
        try {
          await deleteJson(`/api/calendar/events/${encodeURIComponent(editing.id)}`);
          state.calEditing = null;
          await loadCalendarEvents();
          renderDayModal();
        } catch (e) {
          del.disabled = false;
          error.textContent = e?.message || String(e);
        }
      });
      actions.appendChild(del);
    }
    const back = document.createElement("button");
    back.type = "button";
    back.className = "btn-ghost";
    back.textContent = "Back";
    back.addEventListener("click", () => { state.calEditing = null; renderDayModal(); });
    actions.appendChild(back);
    const save = document.createElement("button");
    save.type = "submit";
    save.className = "btn-save";
    save.textContent = editing ? "Save changes" : "Add event";
    actions.appendChild(save);
    form.appendChild(actions);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      error.textContent = "";
      const title = titleInput.value.trim();
      if (!title) { error.textContent = "Title is required."; return; }
      const dateMatch = dateInput.value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      const startMatch = startInput.value.match(/^(\d{2}):(\d{2})/);
      const endMatch = endInput.value.match(/^(\d{2}):(\d{2})/);
      if (!dateMatch || !startMatch || !endMatch) { error.textContent = "Date, start, and end are required."; return; }
      const [, y, mo, da] = dateMatch.map(Number);
      const chosenDayStart = new Date(y, mo - 1, da).getTime();
      if (chosenDayStart < dayBounds(Date.now()).start && (!editing || chosenDayStart !== dayBounds(editing.start).start)) {
        error.textContent = editing
          ? "Events can't be moved to a day that's already passed."
          : "Events can't be added to a day that's already passed.";
        return;
      }
      const start = new Date(y, mo - 1, da, Number(startMatch[1]), Number(startMatch[2])).getTime();
      let end = new Date(y, mo - 1, da, Number(endMatch[1]), Number(endMatch[2])).getTime();
      if (end <= start) end += 86_400_000; // crosses midnight
      let reminders = [];
      const remRaw = remindersInput.value.trim();
      if (remRaw) {
        reminders = remRaw.split(/[,\s]+/).filter(Boolean).map(Number);
        if (reminders.some((n) => !Number.isFinite(n) || n < 0)) {
          error.textContent = "Reminders must be non-negative minutes, e.g. 30, 5.";
          return;
        }
      }
      const payload = {
        title,
        start,
        end,
        location: locationInput.value.trim(),
        notes: notesInput.value.trim(),
        reminders,
      };
      save.disabled = true;
      try {
        await postJson(editing ? `/api/calendar/events/${encodeURIComponent(editing.id)}` : "/api/calendar/events", payload);
        state.calEditing = null;
        await loadCalendarEvents();
        renderDayModal();
      } catch (err) {
        save.disabled = false;
        error.textContent = err?.message || String(err);
      }
    });

    body.appendChild(form);
    if (!editing) titleInput.focus();
  }

  els.composer.addEventListener("submit", send);
  els.voiceComposer.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = els.voiceInput.value.trim();
    if (!text || state.busy || state.streaming) return;
    els.input.value = text;
    els.voiceInput.value = "";
    autogrow();
    autogrowVoice();
    els.composer.requestSubmit();
  });
  els.scrollBottom.addEventListener("click", () => scrollDown(true));
  els.messages.addEventListener("scroll", updateScrollBottomButton, { passive: true });
  els.input.addEventListener("input", autogrow);
  els.voiceInput.addEventListener("input", autogrowVoice);
  els.voiceInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); els.voiceComposer.requestSubmit(); }
  });
  els.input.addEventListener("focus", () => setTimeout(() => { syncViewportHeight(); scrollDown(true); }, 80));
  els.input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); els.composer.requestSubmit(); }
  });
  els.attach.addEventListener("click", () => els.fileInput.click());
  els.fileInput.addEventListener("change", () => {
    state.files.push(...Array.from(els.fileInput.files || []));
    els.fileInput.value = "";
    renderChips();
  });
  els.newChat.addEventListener("click", () => { closeDrawer(); newChat(); });
  els.settingsOpen.addEventListener("click", openSettings);
  els.settingsClose.addEventListener("click", closeSettings);
  els.calendarOpen.addEventListener("click", openCalendar);
  els.calendarClose.addEventListener("click", closeCalendar);
  els.calPrev.addEventListener("click", () => shiftCalMonth(-1));
  els.calNext.addEventListener("click", () => shiftCalMonth(1));
  els.calTodayBtn.addEventListener("click", () => {
    state.calCursor = new Date();
    renderCalendar();
    void loadCalendarEvents();
  });
  els.dayAdd.addEventListener("click", () => { state.calEditing = { id: "" }; renderDayModal(); });
  els.dayClose.addEventListener("click", closeDayModal);
  els.dayModal.addEventListener("click", (e) => { if (e.target === els.dayModal) closeDayModal(); });
  window.addEventListener("keydown", (e) => {
    if (e.key !== "Escape" || els.dayModal.hidden) return;
    if (state.calEditing) { state.calEditing = null; renderDayModal(); }
    else closeDayModal();
  });
  els.menu.addEventListener("click", toggleDrawer);
  els.audio.addEventListener("click", () => { void toggleAudioMode(); });
  els.voiceClose.addEventListener("click", () => { if (state.audioMode) void toggleAudioMode(); });
  els.voiceMinimize.addEventListener("click", () => { els.voiceOverlay.hidden = true; });
  els.scrim.addEventListener("click", closeDrawer);
  els.approve.addEventListener("click", () => decideApproval("approve"));
  els.deny.addEventListener("click", () => decideApproval("deny"));

  for (const eventName of ["pointerdown", "touchstart", "keydown", "focus"]) {
    window.addEventListener(eventName, () => markPresenceActivity(), { passive: true });
  }
  setInterval(() => {
    if (document.visibilityState === "visible") markPresenceActivity();
  }, 30_000);

  // Keep the calendar page fresh while it's open, so events Sophie adds from
  // chat/Telegram appear without reopening the page. Skipped mid-edit so a
  // refresh never clobbers the form.
  setInterval(() => {
    if (state.calendarOpen && !state.calEditing && document.visibilityState === "visible") {
      void loadCalendarEvents();
    }
  }, 20_000);

  // Re-sync when the phone comes back to the app (unless mid-stream).
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      markPresenceActivity(true);
      if (!state.streaming) { loadState(); loadHealth(); }
      if (state.calendarOpen && !state.calEditing) void loadCalendarEvents();
    }
  });

  markPresenceActivity(true);
  loadState();
  loadHealth();
})();
</script>
</body>
</html>
